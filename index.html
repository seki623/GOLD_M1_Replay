<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD M1 Replay v0.6</title><link rel="stylesheet" href="style.css"></head><body><header><b>GOLD M1 Replay <small>v0.6</small></b><span id="status">CSV未読み込み</span></header><main><section class="controls"><label>開始 <input id="startInput" type="datetime-local"></label><label>終了 <input id="endInput" type="datetime-local"></label><button id="loadBtn">期間を読み込む</button><label>速度 <select id="speedSelect"><option>1</option><option>2</option><option>5</option><option>10</option><option selected>12</option><option>20</option><option>50</option><option>100</option></select>x</label><button id="playBtn">▶ 再生</button><button id="stepBackBtn">◀ 1本</button><button id="stepBtn">1本 ▶</button><label><input id="candleToggle" type="checkbox" checked> ローソク足</label><label><input id="levelToggle" type="checkbox" checked> D/W/M OHLC</label><label><input id="indicatorToggle" type="checkbox"> EMA21</label></section><section class="chart-wrap"><canvas id="chart"></canvas><div class="trade-panel"><b>デモトレード</b><div><button id="buyBtn">BUY</button><button id="sellBtn">SELL</button><button id="exitBtn">決済</button></div><div>状態 <b id="positionState">NO POSITION</b></div><div>Entry <b id="entryPrice">—</b></div><div>現在値 <b id="currentPrice">—</b></div><div>損益 <b id="pnl">—</b></div></div><div class="info"><div id="timeLabel">—</div><div id="ohlcLabel">O — H — L — C —</div></div></section><section><input id="progress" type="range" min="0" max="0" value="0"><div class="ends"><span id="firstTime">—</span><span id="lastTime">—</span></div><div id="tradeLog"></div><button id="markBtn">現在足にマーキング</button><button id="deleteMarkBtn">最後を削除</button><button id="clearMarksBtn">全削除</button></section></main><script src="app.js"></script></body></html>
