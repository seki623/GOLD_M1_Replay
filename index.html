<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD M1 Replay v0.4</title><link rel="stylesheet" href="style.css"></head><body><header><b>GOLD M1 Replay v0.4</b><span id="status">CSV未読み込み</span></header><section class="controls"><label>開始 <input id="start" type="datetime-local"></label><label>終了 <input id="end" type="datetime-local"></label><button id="load">期間を読み込む</button><label>速度 <select id="speed"><option>1</option><option>2</option><option>5</option><option>10</option><option selected>12</option><option>20</option><option>50</option><option>100</option></select>x</label><button id="play">▶</button><button id="back">◀</button><button id="next">▶</button><label><input id="showCandle" type="checkbox" checked>足</label><label><input id="showLevels" type="checkbox" checked>D/W/M</label></section><main><div id="chartbox"><canvas id="chart"></canvas><div id="tradePanel"><b>デモトレード</b><div><button id="buy">BUY</button><button id="sell">SELL</button><button id="close">決済</button></div><small>状態 <b id="state">NO POSITION</b><br>Entry <b id="entry">—</b><br>現在値 <b id="price">—</b><br>損益 <b id="pnl">—</b></small></div><div id="info"></div></div><input id="slider" type="range" min="0" max="0" value="0"><div id="times"><span id="first">—</span><span id="last">—</span></div><div><button id="mark">現在足をマーキング</button><button id="delmark">最後を削除</button><button id="clearmark">全削除</button></div><h4>トレード履歴</h4><div id="log"></div></main><script src="app.js"></script></body></html>
